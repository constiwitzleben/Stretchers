# Stretcher — reproducible environment
#
# Hand-written and platform-independent: resolves on linux-64, osx-64 and
# osx-arm64. Versions are those used for the results reported in the paper.
#
#   conda env create -f environment.yml
#   conda activate stretcher
#
# Notes:
#   * FEniCS 2019.1.0 is only needed for the FEM-based synthetic deformations
#     (synthetic_matching.ipynb and scripts/evaluate_table1.py). It is available
#     from conda-forge only, which is why this project uses conda rather than a
#     bare requirements.txt. real_matching.ipynb runs without it.
#   * FEniCS 2019.1.0 has no Windows build. Windows users should use WSL2.
#   * torch is pinned to the CPU/MPS build. For CUDA, install the matching
#     wheel from https://pytorch.org after creating the environment, e.g.
#       pip install torch==2.6.0 torchvision==0.21.0 --index-url \
#         https://download.pytorch.org/whl/cu124

name: stretcher

channels:
  - conda-forge

dependencies:
  - python=3.9
  - pip

  # --- FEM solver (conda-forge only) ---
  - fenics=2019.1.0

  # FEniCS 2019 JIT-compiles variational forms at runtime, so it needs a C++
  # toolchain and pkg-config present in the environment. cxx-compiler is the
  # portable metapackage (clang on macOS, gcc on Linux) - do not replace it
  # with platform-specific compiler packages, which is what made the previous
  # exported environment.yml unsolvable anywhere but osx-arm64.
  - cxx-compiler
  - pkg-config

  # --- pulled in by fenics; pinned to the known-good versions ---
  - numpy=2.0.2

  # --- notebooks ---
  # The repository's primary interface is the four notebooks, so ship a working
  # Jupyter. nbconvert additionally allows headless execution:
  #   jupyter nbconvert --to notebook --execute real_matching.ipynb
  - ipykernel=6.30.1
  - jupyterlab
  - nbconvert

  - pip:
      # --- deep learning ---
      - torch==2.6.0
      - torchvision==0.21.0
      - kornia==0.8.0
      - einops==0.8.1

      # --- imaging / geometry ---
      - scipy==1.13.1
      - scikit-image==0.24.0
      - opencv-python==4.11.0.86
      - pillow==11.1.0
      - imageio==2.37.0

      # --- FEM mesh rendering (textured deformation of the liver images) ---
      - pyvista==0.44.2
      - vtk==9.3.1

      # --- plotting / logging ---
      - matplotlib==3.9.4
      - tensorboard==2.20.0
